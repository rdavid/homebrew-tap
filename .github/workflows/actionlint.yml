#
# Lints the workflows with actionlint. The release archive is downloaded
# directly and verified against its published SHA-256 checksum before it runs.
---
name: actionlint
'on':
  pull_request:
    paths: &paths
      - .github/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          srv=https://github.com/rhysd/actionlint
          sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ver=1.7.12
          tar=actionlint_${ver}_linux_amd64.tar.gz
          curl \
            --fail \
            --location \
            --output "$tar" \
            --retry 3 \
            --show-error \
            --silent \
            "$srv/releases/download/v$ver/$tar"
          printf '%s  %s\n' "$sum" "$tar" | sha256sum --check --status
          tar --extract --file "$tar" --gzip actionlint
          ./actionlint
